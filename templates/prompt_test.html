<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Preview Prompt</title></head>
<body>
  <h1>Prompt Test</h1>
  <form method="post">
    <label>Title:<br><input type="text" name="title" value="{{ title }}" size="80"></label><br>
    <label>Body:<br><textarea name="body" rows="5" cols="80">{{ body }}</textarea></label><br>
    <button type="submit">Generate Prompt</button>
  </form>
  {% if result %}
    <h2>Generated Prompt Parts</h2>
    <ul>
      {% for part in result %}
        <li><pre>{{ part.text }}</pre></li>
      {% endfor %}
    </ul>
  {% endif %}
  <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
