name: Run HANU Feed Bot Now

on:
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum age of posts to process (hours)'
        required: false
        default: '36'
        type: string
      force_run:
        description: 'Force run even if lock exists'
        required: false
        default: false
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run feed bot (one-off)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
          GH_BOT_PAT: ${{ secrets.GH_BOT_PAT }}
        run: |
          echo "Starting one-off bot run"
          # Run the cron worker once; it should respect env inputs
          python cron_worker.py || python main.py || echo "No main runner found"
