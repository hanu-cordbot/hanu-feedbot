name: Run HANU Feed Bot Now

on:
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum age of posts to process (hours)'
        required: false
        default: '36'
        type: string
      force_run:
        description: 'Force run even if lock exists'
        required: false
        default: false
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run feed bot (one-off)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
          GH_BOT_PAT: ${{ secrets.GH_BOT_PAT }}
        run: |
          echo "Starting one-off bot run"
          # Run the cron worker once; it should respect env inputs
          python cron_worker.py || python main.py || echo "No main runner found"

      - name: Upload seen.json to R2 (if present)
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # Provide all known bucket names; script will prefer canonical order
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FEEDS_R2_BUCKET: ${{ secrets.FEEDS_R2_BUCKET }}
          SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
        run: |
          echo "Checking for seen.json to upload to R2"
          echo "PWD=$(pwd)"
          ls -la
          if [ ! -f "seen.json" ]; then
            echo "No seen.json present; skipping upload"
            exit 0
          fi
          # Choose bucket: prefer R2_BUCKET, then FEEDS_R2_BUCKET, then SEEN_R2_BUCKET
          TARGET_BUCKET="${R2_BUCKET:-${FEEDS_R2_BUCKET:-$SEEN_R2_BUCKET}}"
          if [ -z "${TARGET_BUCKET}" ]; then
            echo "No R2 bucket configured (R2_BUCKET/FEEDS_R2_BUCKET/SEEN_R2_BUCKET); skipping upload"
            exit 0
          fi

          echo "Installing awscli"
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install -i /usr/local/aws-cli -b /usr/local/bin || true

          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="us-east-1"

          echo "Uploading seen.json to s3://${TARGET_BUCKET}/seen.json (endpoint: ${R2_ENDPOINT})"
          aws --endpoint-url "${R2_ENDPOINT}" s3 cp "seen.json" "s3://${TARGET_BUCKET}/seen.json" || (echo "Upload failed"; exit 1)
          echo "Uploaded seen.json"
