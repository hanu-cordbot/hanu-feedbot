name: Daily Weather Post

on:
  schedule:
    # 5:00 AM Vietnam time = 22:00 UTC (previous day)
    # Vietnam is UTC+7, so 5am VN = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post weather now'
        required: false
        default: 'true'
        type: boolean

jobs:
  post-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytz pillow

      - name: Post weather to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WEATHER_CHANNEL_ID: ${{ secrets.WEATHER_CHANNEL_ID }}
        run: |
          python weather/post_weather_ci.py

      - name: Update CI status
        if: always()
        run: |
          mkdir -p docs/devops
          cat > docs/devops/weather-ci-status.md << EOF
          # Weather Post CI Status

          **Last run:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Outcome:** ${{ job.status }}
          **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Commit status file
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "HANU Feed Bot"
          git add docs/devops/weather-ci-status.md || true
          git diff --staged --quiet || git commit -m "ci: weather post status - ${{ job.status }}"
          git push || echo "Push failed"
