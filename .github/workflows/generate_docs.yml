name: Generate and publish docs data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (fast smoke)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            python -m pytest -q || true
          fi

      - name: Generate dashboard data
        run: |
          # Ensure feed_map.json and channels.json exist to avoid generator failures
          python - <<'PY'
import os, json
for fn, default in [('feed_map.json', {}), ('channels.json', [])]:
    if not os.path.exists(fn):
        open(fn, 'w', encoding='utf-8').write(json.dumps(default, indent=2))
PY
          python generate_dashboard_data.py

      - name: Commit generated docs/data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data || true
          git add feed_map.json channels.json || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: update generated docs data [skip ci]" || true
            git push origin HEAD:main
          else
            echo "No generated changes to commit."
          fi
