name: Update Dashboard Data

on:
  schedule:
    # Run every hour at minute 5 (5 minutes after Railway cron job)
    - cron: '5 * * * *'
  workflow_dispatch: # Allow manual triggering
  repository_dispatch:
    types: [update-dashboard]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Fetch Railway API Data
        run: |
          # Create data directory if it doesn't exist
          mkdir -p docs/data
          
          # Fetch feeds data from Railway API
          curl -f "https://hanu-feedbot-production.up.railway.app/api/public/feeds" \
            -o docs/data/feeds.json || echo '{"feeds": []}' > docs/data/feeds.json
          
          # Fetch stats data (if available)
          curl -f "https://hanu-feedbot-production.up.railway.app/api/stats" \
            -o docs/data/stats.json || echo '{"stats": {}}' > docs/data/stats.json
          
          # Update timestamp
          echo '{"lastUpdated": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > docs/data/meta.json
          
      - name: Update dashboard config with latest data
        run: |
          # Update the config.js with current timestamp
          sed -i 's/"lastDataUpdate":.*/"lastDataUpdate": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",/' docs/config.js || true
          
      - name: Commit and push if data changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add all data files
          git add docs/data/ docs/config.js
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No data changes detected"
          else
            echo "Data changes detected, committing..."
            git commit -m "🤖 Auto-update dashboard data $(date -u +"%Y-%m-%d %H:%M UTC")"
            git push
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
