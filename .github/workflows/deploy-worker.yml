name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          # Prefer standard secret name
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          command: deploy
          wranglerVersion: '4.33.1'
          # Propagate GitHub secrets into Cloudflare Worker secrets
          secrets: |
            DISCORD_BOT_TOKEN
            GH_BOT_PAT
            ADMIN_PASS_BINDING
            ADMIN_USER_BINDING
            ADMIN_TOKEN
            ADMIN_USER
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GH_BOT_PAT: ${{ secrets.GH_BOT_PAT }}
          ADMIN_PASS_BINDING: ${{ secrets.ADMIN_PASS }}
          ADMIN_USER_BINDING: admin
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_USER: admin

        # Note: this action requires the repo to have a valid cloudflare/wrangler
        # config in cloudflare/wrangler.toml and the secret CF_API_TOKEN configured
        # in the repository settings. The worker will be published and will use the
        # R2 binding configured in wrangler.toml.
