name: HANU Feed Bot

permissions:
  contents: write

"on":
  # Run every hour at minute 0
  schedule:
    - cron: '0 * * * *'
  
  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum age of posts to process (hours)'
        required: false
        default: '36'
        type: string
      force_run:
        description: 'Force run even if lock exists'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean

jobs:
  run-feed-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: 'main'
          persist-credentials: true
          fetch-depth: 0
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    - name: Fetch feed_map.json from R2 (if configured) — verbose
    run: |
      python3 - << 'PY'
      import os, sys, traceback

      def present(name):
        return bool(os.getenv(name))

      envs = [
        ('R2_BUCKET', 'R2_BUCKET'),
        ('SEEN_R2_BUCKET', 'SEEN_R2_BUCKET'),
        ('R2_ACCESS_KEY_ID', 'R2_ACCESS_KEY_ID'),
        ('R2_SECRET_ACCESS_KEY', 'R2_SECRET_ACCESS_KEY'),
        ('R2_ENDPOINT', 'R2_ENDPOINT'),
      ]

      print('🔍 R2 env presence:')
      for k, _ in envs:
        print(f'  {k}:', 'SET' if present(k) else 'MISSING')

      bucket = os.getenv('R2_BUCKET') or os.getenv('SEEN_R2_BUCKET') or os.getenv('FEEDS_R2_BUCKET')
      access = os.getenv('R2_ACCESS_KEY_ID') or os.getenv('R2_ACCESS_KEY')
      secret = os.getenv('R2_SECRET_ACCESS_KEY') or os.getenv('R2_SECRET')
      endpoint = os.getenv('R2_ENDPOINT')

      if not bucket or not access or not secret:
        print('\n⚠️ Missing required R2 credentials — will not attempt download.\n')
        if not os.path.exists('feed_map.json'):
          open('feed_map.json', 'w').write('{}')
          print('📝 Created default empty feed_map.json')
        sys.exit(0)

      try:
        import boto3
      except Exception as e:
        print('❌ boto3 not available in runner:', e)
        sys.exit(2)

      try:
        s3 = boto3.client('s3', aws_access_key_id=access, aws_secret_access_key=secret, endpoint_url=endpoint)
        s3.download_file(bucket, 'feed_map.json', 'feed_map.json')
        print('✅ Downloaded feed_map.json from R2')
        import json
        with open('feed_map.json','r',encoding='utf-8') as f:
          try:
            m = json.load(f)
            print(f"🔎 feed_map.json contains {len(m)} entries; sample keys:")
            for k in list(m.keys())[:10]:
              print('  -', k)
          except Exception as e:
            print('⚠️ Could not parse feed_map.json:', e)
      except Exception as e:
        print('❌ Failed to download feed_map.json:', repr(e))
        try:
          resp = s3.list_objects_v2(Bucket=bucket, Prefix='')
          keys = [o['Key'] for o in resp.get('Contents', [])][:20]
          print('📦 Bucket sample keys (first 20):')
          for k in keys:
            print('  -', k)
        except Exception as e2:
          print('⚠️ Could not list bucket contents:', repr(e2))
        if not os.path.exists('feed_map.json'):
          open('feed_map.json', 'w').write('{}')
          print('📝 Created default empty feed_map.json')
      PY
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: Validate environment variables
        run: |
          python -c "
          import os
          required = [
              'DISCORD_BOT_TOKEN', 
              'GEMINI_API_KEY'
          ]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print(f'❌ Missing required secrets: {missing}')
              print('Please configure these secrets in your repository settings.')
              exit(1)
          # Confirm presence only; do NOT print secret values
          print('✅ All required environment variables present (values hidden)')
          print(f'⏰ Max age: {os.getenv(\"MAX_AGE_HOURS\", \"36\")} hours')
          "
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || secrets.MAX_AGE_HOURS || '36' }}

      - name: Remove stale lock if force run
        if: ${{ github.event.inputs.force_run == 'true' }}
        run: |
          rm -f bot.lock
          echo "🔓 Removed stale lock file (force run enabled)"

      - name: Run HANU Feed Bot
        id: bot_run
        run: |
          echo "🤖 Starting HANU Feed Bot..."
          echo "📅 Run time: $(date)"
          echo "⚙️ Max age: ${{ github.event.inputs.max_age_hours || secrets.MAX_AGE_HOURS || '36' }} hours"
          echo "==============================================="
          
          # Run the bot (ensure env vars are provided via repository secrets)
          python cron_worker.py
          
          echo "==============================================="
          echo "✅ Bot execution completed"
        env:
          # Discord Configuration
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          
          # Gemini AI Configuration
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Cloudflare R2 Configuration
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_REGION: ${{ secrets.R2_REGION || 'auto' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_MAX_BYTES: ${{ secrets.R2_MAX_BYTES || '5000000000' }}
          SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
          
          # Bot Configuration
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || secrets.MAX_AGE_HOURS || '36' }}
          FALLBACK_ENABLED: ${{ secrets.FALLBACK_ENABLED || 'false' }}
          JOB_ENDPOINT: '/job'
          YT_DLP_COOKIES: 'cookies.txt'
          ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'github-actions' }}

      - name: Check bot execution status
        if: always()
        run: |
          if [ "${{ steps.bot_run.outcome }}" = "success" ]; then
            echo "✅ Bot ran successfully"
            
            # Check state files and report statistics
            if [ -f "seen.json" ]; then
              SEEN_COUNT=$(jq length seen.json 2>/dev/null || echo "0")
              echo "📊 Total seen entries: $SEEN_COUNT"
            fi
            
            if [ -f "details_threads.json" ]; then
              THREADS_COUNT=$(jq length details_threads.json 2>/dev/null || echo "0")
              echo "📝 Active threads: $THREADS_COUNT"
            fi
            
            echo "🎯 Bot execution completed successfully"
          else
            echo "❌ Bot execution failed"
            echo "Check the logs above for error details"
            exit 1
          fi

      - name: Check for state changes
        id: check_changes
        run: |
          echo "=== Git Status ==="
          git status --porcelain
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "STATE_CHANGED=false" >> $GITHUB_ENV
            echo "📝 No state changes detected"
          else
            echo "STATE_CHANGED=true" >> $GITHUB_ENV
            echo "📝 State changes detected:"
            git diff --name-only
          fi

      - name: Commit and push state changes
        if: env.STATE_CHANGED == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "HANU Feed Bot"
          
          # Add state files. If SEEN_R2_BUCKET is configured, skip adding seen.json (we persist it to R2)
          if [ -n "${{ env.SEEN_R2_BUCKET || secrets.SEEN_R2_BUCKET }}" ]; then
            echo "SEEN_R2_BUCKET is set; skipping seen.json commit (persisting to R2)"
            git add details_threads.json avatar_cache.json feed_meta.json feed_map.json channels.json groups.json || true
          else
            git add --force seen.json details_threads.json avatar_cache.json feed_meta.json feed_map.json channels.json groups.json || true
          fi
          
          # Commit with timestamp
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "🤖 Update bot state - $TIMESTAMP [skip ci]" || echo "No changes to commit"
          
          # Push changes (use GH_BOT_PAT if provided)
          if [ -n "${{ secrets.GH_BOT_PAT }}" ]; then
            echo "Using GH_BOT_PAT for push"
            git remote set-url origin https://${{ secrets.GH_BOT_PAT }}@github.com/${{ github.repository }}.git
          fi
          git push origin main || echo "⚠️ Push failed or nothing to push"
          echo "✅ State changes committed and pushed (or no changes)"

      - name: Persist CI status to repo (docs/devops/last-ci-status.md)
        if: always()
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "HANU Feed Bot"
          STATUS="${{ steps.bot_run.outcome }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "# CI last run status" > docs/devops/last-ci-status.md
          echo "Run: $RUN_URL" >> docs/devops/last-ci-status.md
          echo "Timestamp: $TIMESTAMP" >> docs/devops/last-ci-status.md
          echo "Outcome: $STATUS" >> docs/devops/last-ci-status.md
          echo "State changed: ${{ env.STATE_CHANGED || 'false' }}" >> docs/devops/last-ci-status.md
          git add docs/devops/last-ci-status.md
          git commit -m "ci: update last CI status - run ${{ github.run_id }}" || echo "No changes to commit"
          # Use GH_BOT_PAT only if provided; don't attempt to push with an empty secret
          if [ -n "${{ secrets.GH_BOT_PAT }}" ]; then
            echo "Using GH_BOT_PAT to push CI status"
            git remote set-url origin https://${{ secrets.GH_BOT_PAT }}@github.com/${{ github.repository }}.git
            git push origin main || echo "⚠️ Failed to push CI status"
          else
            echo "GH_BOT_PAT not set; skipping push of CI status"
          fi

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-execution-logs-${{ github.run_number }}
          path: |
            seen.json
            details_threads.json
            avatar_cache.json
            feed_meta.json
            bot.lock
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          # Clean up lock file
          rm -f bot.lock
          echo "🧹 Cleanup completed"

      - name: Report execution summary
        if: always()
        run: |
          echo "==============================================="
          echo "🎯 HANU Feed Bot Execution Summary"
          echo "==============================================="
          echo "📅 Execution time: $(date)"
          echo "🔄 Workflow run: #${{ github.run_number }}"
          echo "⚙️ Status: ${{ steps.bot_run.outcome }}"
          echo "📝 State changed: ${{ env.STATE_CHANGED || 'false' }}"
          echo "==============================================="
