name: HANU Feed Bot

# Scheduled runs execute under the context of the last user who modified this file.
# Ensure that user has a verified email address to avoid "verify your email" errors.

permissions:
  contents: write
  pages: write
  id-token: write

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Max age of posts to process in hours (e.g., 36 for normal, 200 for 9-day recovery)'
        required: false
        default: '36'
        type: string
      force_run:
        description: 'Force run even if lock exists'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean
      ignore_seen:
        description: 'Ignore seen.json and process all entries'
        required: false
        default: 'false'
        type: string
      fb_post_url:
        description: 'Optional Facebook post URL to download and upload to R2'
        required: false
        default: ''

jobs:
  run-feed-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Optional fetch cookies from R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          NETSCAPE_COOKIES_KEY: ${{ secrets.NETSCAPE_COOKIES_KEY }}
        run: |
          set -e
          if [ -z "${NETSCAPE_COOKIES_KEY}" ] || [ -z "${R2_BUCKET}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_ENDPOINT}" ]; then
            echo "Skipping cookies fetch (missing config)"; exit 0; fi
          python - <<'PY'
          import os, boto3
          b=os.environ['R2_BUCKET']; e=os.environ['R2_ENDPOINT']; a=os.environ['R2_ACCESS_KEY_ID']; s=os.environ['R2_SECRET_ACCESS_KEY']; k=os.environ['NETSCAPE_COOKIES_KEY']
          c=boto3.client('s3', aws_access_key_id=a, aws_secret_access_key=s, endpoint_url=e)
          c.download_file(b, k, 'cookies.txt')
          print('Downloaded cookies.txt from R2')
          PY

      - name: Fetch feed_map.json from R2 (if configured)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python - << 'PY'
          import os, sys
          b=os.getenv('R2_BUCKET'); a=os.getenv('R2_ACCESS_KEY_ID'); s=os.getenv('R2_SECRET_ACCESS_KEY'); e=os.getenv('R2_ENDPOINT')
          if not b or not a or not s:
            print('R2 not configured; skipping feed_map fetch')
            sys.exit(0)
          try:
            import boto3, json, os
            os.makedirs('dashboard/data/source', exist_ok=True)
            c=boto3.client('s3', aws_access_key_id=a, aws_secret_access_key=s, endpoint_url=e)
            for key in ['dashboard/data/source/feed_map.json','dashboard/data/feed_map.json','feed_map.json']:
              try:
                c.download_file(b, key, 'dashboard/data/source/feed_map.json'); print('Downloaded', key); break
              except Exception as ex:
                print('Could not download', key, '-', ex)
            if not os.path.exists('dashboard/data/source/feed_map.json'):
              open('dashboard/data/source/feed_map.json','w').write('{}'); print('Wrote empty dashboard/data/source/feed_map.json')
          except Exception as ex:
            print('boto3 not available or download failed:', ex)
          PY

      - name: Run feed bot (one-off)
        id: bot_run
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || secrets.MAX_AGE_HOURS || '36' }}
          FALLBACK_ENABLED: ${{ secrets.FALLBACK_ENABLED || 'false' }}
          IGNORE_SEEN: ${{ github.event.inputs.ignore_seen || 'false' }}
        run: |
          python cron_worker.py || python bot/main.py

      - name: Upload seen.json to R2 (no repo commit)
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FEEDS_R2_BUCKET: ${{ secrets.FEEDS_R2_BUCKET }}
          SEEN_R2_BUCKET: ${{ secrets.SEEN_R2_BUCKET }}
        run: |
          set -e
          mkdir -p dashboard/data/source
          if [ ! -f "dashboard/data/source/seen.json" ] && [ -f "dashboard/data/seen.json" ]; then mv dashboard/data/seen.json dashboard/data/source/seen.json; fi
          if [ ! -f "dashboard/data/source/seen.json" ] && [ -f "seen.json" ]; then mv seen.json dashboard/data/source/seen.json; fi
          if [ ! -f "dashboard/data/source/seen.json" ]; then echo "No dashboard/data/source/seen.json present; skipping"; exit 0; fi
          if ! command -v aws >/dev/null 2>&1; then curl -sS https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip && unzip -q awscliv2.zip && sudo ./aws/install -i /usr/local/aws-cli -b /usr/local/bin || true; fi
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"; export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"; export AWS_DEFAULT_REGION="us-east-1"
          BUCKET="${R2_BUCKET:-${FEEDS_R2_BUCKET:-$SEEN_R2_BUCKET}}"; if [ -z "$BUCKET" ]; then echo "No R2 bucket configured"; exit 0; fi
          aws --endpoint-url "$R2_ENDPOINT" s3 cp "dashboard/data/source/seen.json" "s3://$BUCKET/dashboard/data/source/seen.json" || echo "Upload failed"

      - name: Persist CI status to repo (docs/devops/last-ci-status.md)
        if: always()
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "HANU Feed Bot"
          STATUS="${{ steps.bot_run.outcome }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "# CI last run status" > docs/devops/last-ci-status.md
          echo "Run: $RUN_URL" >> docs/devops/last-ci-status.md
          echo "Timestamp: $TIMESTAMP" >> docs/devops/last-ci-status.md
          echo "Outcome: $STATUS" >> docs/devops/last-ci-status.md
          git add docs/devops/last-ci-status.md
          git commit -m "ci: update last CI status - run ${{ github.run_id }}" || echo "No changes to commit"
          git push || true

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-execution-logs-${{ github.run_number }}
          path: |
            dashboard/data/seen.json
            details_threads.json
            avatar_cache.json
            feed_meta.json
            bot.lock
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate Dashboard Data
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -e
          echo "📊 Generating dashboard data..."
          
          # Fetch additional data from R2 for dashboard
          python - << 'PY'
          import os, sys
          b=os.getenv('R2_BUCKET'); a=os.getenv('R2_ACCESS_KEY_ID'); s=os.getenv('R2_SECRET_ACCESS_KEY'); e=os.getenv('R2_ENDPOINT')
          if not b or not a or not s:
            print('R2 not configured; skipping additional data fetch')
            sys.exit(0)
          try:
            import boto3
            os.makedirs('dashboard/data/source', exist_ok=True)
            c=boto3.client('s3', aws_access_key_id=a, aws_secret_access_key=s, endpoint_url=e)
            
            # Fetch channels.json
            for key in ['dashboard/data/source/channels.json','dashboard/data/channels.json','channels.json']:
              try:
                c.download_file(b, key, 'dashboard/data/source/channels.json'); print('Downloaded', key); break
              except Exception as ex:
                print('Could not download', key, '-', ex)
            
            # Fetch groups.json
            for key in ['dashboard/data/source/groups.json','dashboard/data/groups.json','groups.json']:
              try:
                c.download_file(b, key, 'dashboard/data/source/groups.json'); print('Downloaded', key); break
              except Exception as ex:
                print('Could not download', key, '-', ex)
            
            # Fetch feeds.txt
            for key in ['dashboard/data/source/feeds.txt','dashboard/data/feeds.txt','feeds.txt']:
              try:
                c.download_file(b, key, 'dashboard/data/source/feeds.txt'); print('Downloaded', key); break
              except Exception as ex:
                print('Could not download', key, '-', ex)
          except Exception as ex:
            print('boto3 not available or download failed:', ex)
          PY
          
          # Fetch channel names if Discord token available
          if [ -n "$DISCORD_BOT_TOKEN" ]; then
            python fetch_channel_names.py || echo "fetch_channel_names failed (non-fatal)"
          fi
          
          # Ensure required files exist
          python - <<'PY'
          import os, json
          os.makedirs('dashboard/data/source', exist_ok=True)
          ch_path = 'dashboard/data/source/channels.json'
          if not os.path.exists(ch_path):
              open(ch_path, 'w', encoding='utf-8').write(json.dumps([], indent=2))
          PY
          
          # Generate dashboard data
          python generate_dashboard_data.py
          
          # Check if there are changes to commit
          if git diff --quiet docs/data/; then
            echo "✅ No dashboard data changes to commit"
          else
            echo "📝 Committing dashboard data changes..."
            git add docs/data/
            git commit -m "📊 Update dashboard data - run ${{ github.run_id }}" || echo "No changes to commit"
            git push || echo "Failed to push dashboard data"
          fi

      - name: Download Facebook video (if URL provided)
        if: ${{ github.event.inputs.fb_post_url != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NETSCAPE_COOKIES_KEY: ${{ secrets.NETSCAPE_COOKIES_KEY }}
        run: |
          set -e
          # Fetch cookies if available
          if [ -n "$NETSCAPE_COOKIES_KEY" ] && [ -n "$R2_BUCKET" ]; then
            python - <<'PY'
          import os, boto3
          b=os.environ.get('R2_BUCKET'); e=os.environ.get('R2_ENDPOINT'); a=os.environ.get('R2_ACCESS_KEY_ID'); s=os.environ.get('R2_SECRET_ACCESS_KEY'); k=os.environ.get('NETSCAPE_COOKIES_KEY')
          if all([b,e,a,s,k]):
            try:
              c=boto3.client('s3', aws_access_key_id=a, aws_secret_access_key=s, endpoint_url=e)
              c.download_file(b, k, 'netscape_cookies.txt')
              print('Downloaded cookies from R2')
            except Exception as ex:
              print('Could not download cookies:', ex)
          PY
          fi
          
          # Download and upload Facebook video
          python tools/fb_upload_run.py "${{ github.event.inputs.fb_post_url }}" || echo "FB upload step failed (non-fatal)"

      - name: Upload dashboard data to R2
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FEEDS_R2_BUCKET: ${{ secrets.FEEDS_R2_BUCKET }}
        run: |
          set -e
          BUCKET="${R2_BUCKET:-${FEEDS_R2_BUCKET:-$SEEN_R2_BUCKET}}"
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$BUCKET" ]; then
            echo "Missing required R2 secrets; skipping upload"
            exit 0
          fi

          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            sudo ./aws/install -i /usr/local/aws-cli -b /usr/local/bin || true
          fi

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="us-east-1"

          PREFIX="dashboard/data"
          
          # Upload generated dashboard data
          mkdir -p docs/data
          for f in docs/data/*.json; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            key="$PREFIX/$base"
            echo "Uploading $f -> s3://$BUCKET/$key"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$f" "s3://$BUCKET/$key" --acl public-read || echo "Upload failed for $f"
          done

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload artifact for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

