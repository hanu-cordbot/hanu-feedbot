name: Generate and deploy dashboard data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      fb_post_url:
        description: 'Optional Facebook post URL to download and upload to R2'
        required: false
        default: ''
  # Trigger after the feed-bot workflow completes (so data produced by the bot is available)
  workflow_run:
    workflows:
      - 'feed-bot.yml'
    types:
      - completed

jobs:
  build-and-deploy:
    # Only run on workflow_run when the previous workflow completed successfully
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch feed_map.json from R2 (if configured)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python - << 'PY'
          import os, sys
          bucket = os.getenv('R2_BUCKET') or os.getenv('FEEDS_R2_BUCKET')
          access = os.getenv('R2_ACCESS_KEY_ID')
          secret = os.getenv('R2_SECRET_ACCESS_KEY')
          endpoint = os.getenv('R2_ENDPOINT')
          if not bucket or not access or not secret:
            print('R2 credentials not present; skipping fetch of feed_map.json')
            os.makedirs('dashboard/data/source', exist_ok=True)
            if not os.path.exists('dashboard/data/source/feed_map.json'):
              open('dashboard/data/source/feed_map.json','w').write('{}')
              print('Wrote empty dashboard/data/source/feed_map.json')
            sys.exit(0)
          try:
            import boto3
            s3 = boto3.client('s3', aws_access_key_id=access, aws_secret_access_key=secret, endpoint_url=endpoint)
            os.makedirs('dashboard/data/source', exist_ok=True)
            # Try new authoritative path first, fallback to legacy locations
            for key in ['dashboard/data/source/feed_map.json', 'dashboard/data/feed_map.json', 'feed_map.json']:
              try:
                s3.download_file(bucket, key, 'dashboard/data/source/feed_map.json')
                print('Downloaded', key)
                break
              except Exception as e:
                print('Could not download', key, '-', e)
          except Exception as e:
            print('boto3 not available or download failed:', e)
            os.makedirs('dashboard/data/source', exist_ok=True)
            if not os.path.exists('dashboard/data/source/feed_map.json'):
              open('dashboard/data/source/feed_map.json','w').write('{}')
              print('Wrote empty dashboard/data/source/feed_map.json')
          PY

      - name: Fetch seen.json from R2 (optional)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python - << 'PY'
          import os, sys
          b=os.getenv('R2_BUCKET'); a=os.getenv('R2_ACCESS_KEY_ID'); s=os.getenv('R2_SECRET_ACCESS_KEY'); e=os.getenv('R2_ENDPOINT')
          if not b or not a or not s:
            print('R2 not configured; skipping seen.json fetch')
            sys.exit(0)
          try:
            import boto3, os
            os.makedirs('dashboard/data/source', exist_ok=True)
            c=boto3.client('s3', aws_access_key_id=a, aws_secret_access_key=s, endpoint_url=e)
            for key in ['dashboard/data/source/seen.json','dashboard/data/seen.json','seen.json']:
              try:
                c.download_file(b, key, 'dashboard/data/source/seen.json'); print('Downloaded', key); break
              except Exception as ex:
                print('Could not download', key, '-', ex)
          except Exception as ex:
            print('boto3 not available or download failed:', ex)
          PY

      - name: Fetch channel names (CI only; prefer Discord API)
        if: ${{ env.DISCORD_BOT_TOKEN != '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python fetch_channel_names.py || echo "fetch_channel_names failed (non-fatal)"

      - name: Fetch secrets (netscape cookies) from R2
        if: ${{ github.event.inputs.fb_post_url != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NETSCAPE_COOKIES_KEY: ${{ secrets.NETSCAPE_COOKIES_KEY }}
        run: |
          set -e
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 not configured; skipping cookies fetch"
            exit 0
          fi
          if ! python -c "import boto3" >/dev/null 2>&1; then
            python -m pip install boto3
          fi
          python - <<'PY'
          import os
          import boto3
          b=os.environ.get('R2_BUCKET')
          e=os.environ.get('R2_ENDPOINT')
          a=os.environ.get('R2_ACCESS_KEY_ID')
          s=os.environ.get('R2_SECRET_ACCESS_KEY')
          key=os.environ.get('NETSCAPE_COOKIES_KEY')
          client=boto3.client('s3', aws_access_key_id=a, aws_secret_access_key=s, endpoint_url=e)
          try:
              client.download_file(b, key, 'netscape_cookies.txt')
              print('Downloaded netscape_cookies.txt from R2 (private key)')
          except Exception as ex:
              print('Could not download netscape_cookies.txt:', ex)
          PY

      - name: Download Facebook video and upload to R2 (repo helper)
        if: ${{ github.event.inputs.fb_post_url != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          python tools/fb_upload_run.py "${{ github.event.inputs.fb_post_url }}" || echo "FB upload step failed (non-fatal)"

      - name: Generate dashboard data
        run: |
          # Ensure channels.json exists to avoid generator failures
          # NOTE: Do NOT overwrite dashboard/data/feed_map.json as it should persist from R2 download
          python - <<'PY'
          import os, json
          os.makedirs('dashboard/data/source', exist_ok=True)
          # Ensure source channels.json exists for generator
          ch_path = 'dashboard/data/source/channels.json'
          if not os.path.exists(ch_path):
              open(ch_path, 'w', encoding='utf-8').write(json.dumps([], indent=2))
          PY
          python generate_dashboard_data.py

      - name: Upload generated docs/data and source configs -> R2 (if configured)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          FEEDS_R2_BUCKET: ${{ secrets.FEEDS_R2_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          BUCKET="${R2_BUCKET:-${FEEDS_R2_BUCKET:-$SEEN_R2_BUCKET}}"
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$BUCKET" ]; then
            echo "Missing required R2 secrets; skipping upload"
            exit 0
          fi

          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            sudo ./aws/install -i /usr/local/aws-cli -b /usr/local/bin || true
          fi

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="us-east-1"

          PREFIX="dashboard/data"
          PREFIX=$(echo "$PREFIX" | sed 's#^/*##; s#/*$##')

          # Upload authoritative source configs (feed_map.json, channels.json, groups.json, feeds.txt)
          if [ -d "dashboard/data/source" ]; then
            echo "Syncing dashboard/data/source -> s3://$BUCKET/dashboard/data/source/"
            aws --endpoint-url "$R2_ENDPOINT" s3 sync "dashboard/data/source" "s3://$BUCKET/dashboard/data/source" --acl public-read --exclude ".git/*" || echo "Source sync failed"
          fi

          mkdir -p docs/data
          for f in docs/data/*.json; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            key="$PREFIX/$base"
            echo "Uploading $f -> s3://$BUCKET/$key (endpoint: $R2_ENDPOINT)"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$f" "s3://$BUCKET/$key" --acl public-read || echo "Upload failed for $f"
          done

      - name: Deploy to GitHub Pages (docs/)
        uses: actions/configure-pages@v4

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
