name: Upload dashboard data to Cloudflare R2

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/data/**'
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docs/data/*.json to R2 (S3-compatible via aws-cli)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          FEEDS_R2_BUCKET: ${{ secrets.FEEDS_R2_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          # Determine bucket name (prefer FEEDS_R2_BUCKET, fall back to R2_BUCKET)
          BUCKET="${FEEDS_R2_BUCKET:-$R2_BUCKET}"
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$BUCKET" ]; then
            echo "Missing required secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, and FEEDS_R2_BUCKET or R2_BUCKET"
            exit 1
          fi

          echo "Installing awscli v2"
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install -i /usr/local/aws-cli -b /usr/local/bin || true

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="us-east-1"

          # Use dashboard prefix if provided, default to 'dashboard/data'
          PREFIX="${{ secrets.DASHBOARD_PREFIX || 'dashboard/data' }}"
          # Trim slashes
          PREFIX=$(echo "$PREFIX" | sed 's#^/*##; s#/*$##')

          for f in docs/data/*.json; do
            [ -f "$f" ] || continue
            key="$PREFIX/$(basename "$f")"
            echo "Uploading $f -> s3://$BUCKET/$key (endpoint: $R2_ENDPOINT)"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$f" "s3://$BUCKET/$key" --acl public-read
            echo "Uploaded $f"
          done
